version: 2
updates:
  # CI-only validators and hash-locked test tools are separate from runtime deps.
  - package-ecosystem: "npm"
    directory: "/ci"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/ci"
    schedule:
      interval: "weekly"
    # Radon 6.0.1 requires mando <0.8. Revisit when the Radon lock changes.
    ignore:
      - dependency-name: "mando"
        versions: [">=0.8"]
  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    # CodeQL init and analyze share one versioned configuration format.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10

  # npm (Node dispatcher)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10

  # pip (Python wrapper package)
  - package-ecosystem: "pip"
    directory: "/python"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10

  # cargo (Rust wrapper package)
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
