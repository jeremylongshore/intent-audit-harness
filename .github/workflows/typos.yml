name: Typos

# Advisory (non-blocking) source-code spell-check via crate-ci/typos.
# Configuration + domain-term ignore-list lives in .typos.toml.
# This lane NEVER blocks a merge: the job is continue-on-error, so genuine
# typos surface as annotations without gating required CI.
#
# Part of iep-typos-rollout: one advisory typos lane across all 5 IEP repos.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: typos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typos:
    name: typos (spell-check, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1.47.2
        with:
          config: .typos.toml
