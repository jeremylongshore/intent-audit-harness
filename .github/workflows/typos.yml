name: Typos

# Blocking source-code spell-check via crate-ci/typos.
# Configuration + domain-term ignore-list lives in .typos.toml.
# A genuine typo (not in the .typos.toml domain-vocabulary ignore-list) blocks
# the PR. Extend .typos.toml for legitimate domain terms — do not soften the gate.
#
# Part of iep-typos-rollout: one typos lane across all 5 IEP repos.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: typos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.49.0
        with:
          config: .typos.toml
