name: Actionlint

# Advisory (non-blocking) lint of GitHub Actions workflow YAML via rhysd/actionlint.
# Catches workflow-syntax errors, expression typos, deprecated runner labels,
# shellcheck findings in `run:` blocks, and bad `uses:` refs.
# This lane NEVER blocks a merge: the job is continue-on-error, so findings
# surface as annotations without gating required CI.
#
# Part of iep-actionlint-coverage: one advisory actionlint lane across all 5 IEP repos.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint (workflow lint, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Run actionlint
        # Pinned actionlint release; downloads the official static binary and
        # lints every .github/workflows/*.yml. Pin bumps are explicit PRs.
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp actionlint
          /tmp/actionlint -version
          /tmp/actionlint -color
