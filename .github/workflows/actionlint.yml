name: Actionlint

# Blocking lint of GitHub Actions workflow YAML via rhysd/actionlint.
# Catches workflow-syntax errors, expression typos, deprecated runner labels,
# shellcheck findings in `run:` blocks, and bad `uses:` refs.
# A finding (non-zero actionlint exit) blocks the PR.
#
# Part of iep-actionlint-coverage: one actionlint lane across all 5 IEP repos.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run actionlint
        # Pinned actionlint release; downloads the official static binary and
        # lints every .github/workflows/*.yml. Pin bumps are explicit PRs.
        run: |
          set -euo pipefail
          python3 ci/install-tool.py actionlint "$RUNNER_TEMP/actionlint-bin"
          "$RUNNER_TEMP/actionlint-bin/actionlint" -version
          "$RUNNER_TEMP/actionlint-bin/actionlint" -color
