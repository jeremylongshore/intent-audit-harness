name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # nightly self-check at 06:00 UTC
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  self-check:
    name: audit-harness self-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm install

      - name: audit-harness verify (self-check via dispatcher)
        run: node bin/audit-harness.js verify || true
        # exit 0 expected for now — verify subcommand prints info, doesn't gate
        # tighten to fail-on-non-zero once verify produces deterministic output

      - name: audit-harness list (self-check enumeration)
        # Self-pin landed via iep-P3 iah-self-pin (bd_000-projects-itpl).
        # .harness-hash is now committed at repo root pinning scripts/*.sh,
        # scripts/*.py, bin/audit-harness.js, and .harness-hash-extra-patterns
        # itself. Exit-3 tolerance removed: any future no-manifest condition
        # is a real CI failure, not the expected baseline state.
        run: node bin/audit-harness.js list

      - name: harness-hash --verify (idempotency check on the hash manifest)
        # Hard-fail: any byte change to a pinned policy file without a fresh
        # --init + commit of the regenerated .harness-hash exits 2 (HARNESS_TAMPERED)
        # and blocks the PR. Per audit-harness CLAUDE.md design rule 5.
        run: bash scripts/harness-hash.sh --verify

      - name: escape-scan against synthetic threshold-lowering input
        run: |
          # Stage a synthetic threshold-lowering edit and confirm escape-scan REFUSES.
          # This is the canonical self-check per CLAUDE.md design rule 5.
          mkdir -p /tmp/synthetic-repo
          cd /tmp/synthetic-repo
          git init -q
          # GitHub-hosted runners do NOT set a default git identity. Without
          # this, `git commit` below fails with "fatal: empty ident name". We
          # set it locally to this synthetic repo only — does not pollute the
          # actual workspace.
          git config --local user.email "ci@audit-harness.local"
          git config --local user.name "audit-harness CI"
          mkdir -p tests
          echo "coverage_floor: 80" > tests/TESTING.md
          git add tests/TESTING.md
          git commit -q -m "baseline" --allow-empty-message
          echo "coverage_floor: 60" > tests/TESTING.md
          git add tests/TESTING.md
          # Run escape-scan; expect non-zero exit (REFUSE) when policy is being weakened
          if bash $GITHUB_WORKSPACE/scripts/escape-scan.sh --staged 2>&1 | tee /tmp/escape-scan.log; then
            echo "::warning::escape-scan did NOT refuse on synthetic threshold-lowering input — review scripts/escape-scan.sh"
            # tighten to exit 1 once escape-scan output is deterministic
          else
            echo "✓ escape-scan correctly refused"
          fi

  shellcheck:
    name: shellcheck (script lint)
    runs-on: ubuntu-latest
    # Hard-fail per iah-shellcheck-hard-fail (bd_000-projects-4asc) + IEP
    # Convergence Debt Plan Priority 6 Phase A1. Version-pinned per
    # iah-shellcheck-version-pin (bd_000-projects-v1ds, v1.1.4 bundle) so
    # a future shellcheck release can't surface new rules silently against
    # already-merged code. To bump: edit SHELLCHECK_VERSION below + run
    # `shellcheck scripts/*.sh` locally to confirm nothing new fires +
    # commit as part of an explicit PR. Stable releases at
    # https://github.com/koalaman/shellcheck/releases
    env:
      SHELLCHECK_VERSION: "v0.10.0"
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned shellcheck
        run: |
          curl -sSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck scripts/*.sh

  ruff:
    name: ruff (Python lint)
    runs-on: ubuntu-latest
    # Hard-fail per iah-ruff (bd_000-projects-x9bs) + IEP Convergence Debt
    # Plan Priority 6 Phase A2. Permissive E + F base ruleset; ratchet up
    # later. Version-pinned per iah-shellcheck-version-pin lesson so a future
    # ruff release can't surface new rules silently against already-merged
    # code. To bump: edit the pinned version below + run `ruff check` locally
    # to confirm nothing new fires + commit as part of an explicit PR.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ruff (pinned)
        run: pip install 'ruff==0.15.4'
      - name: ruff check
        run: |
          ruff --version
          ruff check

  python-syntax:
    name: python -m py_compile (script lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile-check Python scripts
        run: |
          find scripts -name '*.py' -print0 | xargs -0 -n1 python -m py_compile

  version-canonical-check:
    name: Manifest version + license alignment
    # Per IEP Convergence Debt Plan Priority 3 (iah-version-canonical-check,
    # iah-version-drift, iah-license-drift). The npm package.json is the
    # canonical source of truth for version + license; the other three
    # polyglot manifests (version.txt, python/pyproject.toml, rust/Cargo.toml)
    # MUST match exactly. CI fails if any drift is detected.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify all 4 manifests carry the same version and Apache-2.0 license
        shell: bash
        run: |
          set -euo pipefail

          # 1. Extract canonical version from npm package.json
          canonical_version=$(node -p "require('./package.json').version")
          canonical_license=$(node -p "require('./package.json').license")
          echo "Canonical (npm package.json): version=${canonical_version}, license=${canonical_license}"

          if [[ "${canonical_license}" != "Apache-2.0" ]]; then
            echo "::error file=package.json::canonical license MUST be Apache-2.0; got '${canonical_license}'"
            exit 1
          fi

          fail=0

          # 2. version.txt
          if [[ -f version.txt ]]; then
            vt=$(head -n 1 version.txt | tr -d '[:space:]')
            if [[ "${vt}" != "${canonical_version}" ]]; then
              echo "::error file=version.txt::version drift — version.txt='${vt}' canonical='${canonical_version}'"
              fail=1
            fi
          else
            echo "::warning::version.txt not present (acceptable if intentionally deleted)"
          fi

          # 3. python/pyproject.toml
          if [[ -f python/pyproject.toml ]]; then
            py_ver=$(grep -E '^version\s*=' python/pyproject.toml | head -n 1 | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/')
            py_lic=$(grep -E '^license\s*=' python/pyproject.toml | head -n 1 | sed -E 's/^license\s*=\s*\{\s*text\s*=\s*"([^"]+)".*/\1/')
            if [[ "${py_ver}" != "${canonical_version}" ]]; then
              echo "::error file=python/pyproject.toml::version drift — pyproject='${py_ver}' canonical='${canonical_version}'"
              fail=1
            fi
            if [[ "${py_lic}" != "Apache-2.0" ]]; then
              echo "::error file=python/pyproject.toml::license drift — pyproject='${py_lic}' expected='Apache-2.0'"
              fail=1
            fi
          fi

          # 3a. python/src/intent_audit_harness/__init__.py __version__
          if [[ -f python/src/intent_audit_harness/__init__.py ]]; then
            py_init_ver=$(grep -E '^__version__\s*=' python/src/intent_audit_harness/__init__.py | head -n 1 | sed -E 's/^__version__\s*=\s*"([^"]+)".*/\1/')
            if [[ "${py_init_ver}" != "${canonical_version}" ]]; then
              echo "::error file=python/src/intent_audit_harness/__init__.py::version drift — __version__='${py_init_ver}' canonical='${canonical_version}'"
              fail=1
            fi
          fi

          # 4. rust/Cargo.toml
          if [[ -f rust/Cargo.toml ]]; then
            rs_ver=$(grep -E '^version\s*=' rust/Cargo.toml | head -n 1 | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/')
            rs_lic=$(grep -E '^license\s*=' rust/Cargo.toml | head -n 1 | sed -E 's/^license\s*=\s*"([^"]+)".*/\1/')
            if [[ "${rs_ver}" != "${canonical_version}" ]]; then
              echo "::error file=rust/Cargo.toml::version drift — Cargo.toml='${rs_ver}' canonical='${canonical_version}'"
              fail=1
            fi
            if [[ "${rs_lic}" != "Apache-2.0" ]]; then
              echo "::error file=rust/Cargo.toml::license drift — Cargo.toml='${rs_lic}' expected='Apache-2.0'"
              fail=1
            fi
          fi

          # 4a. rust/Cargo.lock package entry
          if [[ -f rust/Cargo.lock ]]; then
            rs_lock_ver=$(awk '/^\[\[package\]\]/{p=1; next} p && /^name = "intent-audit-harness"/{getline; if($1=="version"){gsub(/"/,"",$3); print $3; exit}}' rust/Cargo.lock)
            if [[ -n "${rs_lock_ver}" && "${rs_lock_ver}" != "${canonical_version}" ]]; then
              echo "::error file=rust/Cargo.lock::version drift — Cargo.lock='${rs_lock_ver}' canonical='${canonical_version}'"
              fail=1
            fi
          fi

          if [[ ${fail} -ne 0 ]]; then
            echo ""
            echo "::error::Manifest drift detected. The npm package.json is the canonical source of truth for version + license per IEP Convergence Debt Plan Priority 3. Run \`npm version <bump>\` to bump the canonical version, then mirror to version.txt / pyproject.toml / Cargo.toml / Cargo.lock / __init__.py."
            exit 1
          fi

          echo ""
          echo "All manifests aligned at version=${canonical_version}, license=Apache-2.0."

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Manifest version + license alignment" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Verifies that \`version.txt\`, \`python/pyproject.toml\`, \`python/src/intent_audit_harness/__init__.py\`, \`rust/Cargo.toml\`, and \`rust/Cargo.lock\` all agree with the canonical \`package.json\` for both version and Apache-2.0 license." >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Per IEP Convergence Debt Plan Priority 3: \`iah-version-canonical-check\` + \`iah-version-drift\` + \`iah-license-drift\`." >> "${GITHUB_STEP_SUMMARY}"

  regression:
    name: backward-compat regression suite (v0.3.0+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install jsonschema (for SPEC validation)
        run: pip install jsonschema
      - name: Stage gate-result schema fixture
        run: |
          mkdir -p tests/fixtures
          # The schema lives in the sister repo intent-eval-lab; for CI we fetch
          # the published v0.1.0-draft URL once that's online. Until then, copy
          # any local sibling clone if available; otherwise the suite skips
          # Section 3 with a warning and still validates Sections 1, 2, 4.
          if [[ ! -f tests/fixtures/gate-result.schema.json ]]; then
            curl -sSL -o tests/fixtures/gate-result.schema.json \
              https://raw.githubusercontent.com/jeremylongshore/intent-eval-lab/main/specs/evidence-bundle/v0.1.0-draft/schema/gate-result.schema.json \
              || echo "schema not yet available — Section 3 will be skipped"
          fi
      - name: Run regression suite
        run: bash tests/regression/run-regression.sh

  classify:
    name: classify golden suite (audit-profile/v1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install jsonschema (for audit-profile/v1 validation)
        run: pip install jsonschema
      - name: Run classify golden suite
        run: bash tests/classify/run-classify-tests.sh

  conform:
    name: conform golden suite (gate-result/v1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install jsonschema + PyYAML
        # jsonschema validates every emitted gate-result/v1 row; PyYAML is the
        # frontmatter parser conform requires for a reliable skill/agent verdict
        # (absent => conform emits an honest ADVISORY indeterminate, never a guess).
        run: pip install jsonschema pyyaml
      - name: Run conform golden suite
        run: bash tests/conform/run-conform-tests.sh

  audit:
    name: audit golden suite (testing-depth gate-runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install jsonschema
        run: pip install jsonschema
      - name: Run audit golden suite
        run: bash tests/audit/run-audit-tests.sh

  scan:
    name: scan golden suite (security/hygiene/skill-quality)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install jsonschema
        run: pip install jsonschema
      - name: Run scan golden suite
        run: bash tests/scan/run-scan-tests.sh

  currency:
    name: currency advisory report suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run currency golden suite
        run: bash tests/currency/run-currency-tests.sh

  golden:
    name: golden-master stdout suite (gherkin-lint + crap-score)
    runs-on: ubuntu-latest
    # Pins the raw stdout of the two scorers whose output shape is a
    # downstream contract (emit-evidence pipeline + dashboards + audit-tests
    # skill). The per-row schema gate validates the AUGMENTED predicate, not
    # the raw scorer stdout — this suite catches a silent stdout reshape the
    # schema gate cannot. CI installs no complexity provider, so the golden
    # captures crap-score's no-provider envelope shape (deterministic).
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run golden-master suite
        run: bash tests/golden/run-golden.sh

  layer-applicability-drift:
    name: layer-applicability projection drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify layer-applicability.md is in sync with the registry datum
        # schemas/audit-profile/layer-applicability.md is a PROJECTION of
        # registry.v1.json. This gate fails if the committed doc drifts — keeping
        # the registry the single canonical datum (PP-PLAN-040 c2b).
        run: python3 scripts/gen-layer-applicability.py --check

  fp-rate:
    name: gate FP-rate measurement (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PyYAML (conform frontmatter parser)
        run: pip install pyyaml
      - name: Measure conform-gate FP/FN rate over the labeled corpus
        # Advisory measurement (does not gate the build by default). Promotion of a
        # gate to enforcement=blocking requires FP-rate <= 5% here, then an
        # engineer pin in tests/TESTING.md (PP-PLAN-040 c2e; docs/gate-promotion.md).
        run: python3 scripts/fp-rate.py --max-fp-rate 0.05

# Convergence: this workflow is the first CI for audit-harness. The regression job
# (added v0.3.0 / Milestone 2 of build journey ~/.claude/plans/se-the-council-bubbly-frog.md)
# enforces backward-compat for the --json + emit-evidence additions. See SEMVER.md.
