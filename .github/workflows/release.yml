name: Release

# Publishes @intentsolutions/audit-harness to npm with Sigstore provenance.
#
# This is the package's first real release pipeline. Before it existed, npm was
# stuck at 0.1.0 while the code had advanced to 1.1.x — there was no workflow to
# publish the CHANGELOG-documented work. This closes that gap.
#
# Triggered by:
#   - pushing a tag matching `v*.*.*` (e.g., v1.1.5), OR
#   - manual `workflow_dispatch` (publishes whatever version package.json carries)
#
# The job:
#   1. Verifies package.json#version matches the pushed tag (skipped on manual
#      dispatch, where there is no tag to compare against).
#   2. Runs the self-check (`audit-harness --version`) and the repo's `test`
#      script (escape-scan on the staged diff — non-blocking when nothing is
#      staged, which is the case in CI).
#   3. `npm publish --provenance --access public` (requires id-token: write for
#      the Sigstore OIDC token).
#
# This is a zero-runtime-dependency polyglot CLI: Node >=18 dispatcher + bash/
# python scripts. There is NO lockfile, NO TypeScript build, NO coverage step —
# so this workflow deliberately omits pnpm, --frozen-lockfile, build, and
# coverage steps that the intent-eval-core release workflow carries.
#
# Provenance attestation lands at https://registry.npmjs.org/@intentsolutions/audit-harness
# alongside the published tarball. Consumers can verify with `npm audit signatures`.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write  # create the GitHub Release + upload the dashboard manifest asset
  # Required for npm provenance + cosign keyless (Sigstore OIDC token).
  id-token: write

jobs:
  release:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # ISEDC E09 DR / CISO reproducible-from-tag invariant (#32 bug class):
          # pin the checked-out bytes to the exact ref that triggered this run —
          # the pushed tag on a tag release — instead of relying on
          # actions/checkout's implicit default. Provenance is a one-way door; a
          # wrong-bytes attestation is unrecoverable, so the bytes we publish +
          # sign MUST be the bytes of the tag, never main. On workflow_dispatch
          # github.ref is the dispatched branch ref (the deliberate escape hatch,
          # which publishes whatever package.json carries).
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Verify tag matches package.json version
        # Only meaningful on a tag push. On workflow_dispatch there is no tag,
        # so skip the comparison and publish whatever version package.json holds.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF#refs/tags/v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag v$tag_version does not match package.json version $pkg_version"
            exit 1
          fi
          echo "Tag and package version both: $tag_version"

      - name: Self-check (audit-harness --version)
        run: node bin/audit-harness.js --version

      - name: Test (escape-scan on staged diff; non-blocking in CI)
        run: bash scripts/escape-scan.sh --staged || true

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Create the GitHub Release on a tag push so the emit-evidence job below can
      # attach the dashboard's report-manifest.json to it. (Only meaningful on a
      # tag; workflow_dispatch has no tag to release.)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
          else
            gh release create "$tag" --title "audit-harness $tag" --generate-notes --latest
          fi

  # ── Emit this repo's own testing evidence for the dashboard (bead nr75.12) ──
  #
  # CI-ONLY. @intentsolutions/core is installed with `npm i --no-save` so the
  # published zero-dependency package surface stays untouched (package.json keeps
  # empty dependencies + devDependencies). The emitter lives in ci/ (excluded
  # from package.json#files), so it never ships to npm consumers.
  #
  # Runs audit-harness's real deterministic self-gate (harness-hash --verify) →
  # kernel gate-result/v1 row → kernel EvidenceBundle (ci/emit-evidence.ts,
  # fail-closed against the @intentsolutions/core schemas pinned to the version
  # the dashboard verifies with), keyless-signs the canonical bytes with cosign
  # (Fulcio OIDC + Rekor), assembles report-manifest.json, and uploads it onto
  # this tag's Release. The dashboard re-verifies OIDC subject + Rekor inclusion +
  # DSSE + kernel schema at ingest. Only runs on a tag push (the dashboard pins
  # refs/tags/* — a workflow_dispatch main-ref manifest would not verify).
  emit-evidence:
    name: Emit signed gate-result evidence for the dashboard
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload the manifest onto the Release
      id-token: write # cosign keyless (Fulcio OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # ISEDC E09 DR / CISO reproducible-from-tag invariant (#32 bug class):
          # this job signs the EvidenceBundle, so the canonical bytes it hashes +
          # cosign-signs MUST come from the pushed tag, not main. This job only
          # runs on a tag push (if: startsWith(github.ref, 'refs/tags/v')), so
          # github.ref is always the tag here.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Node >= 22.6 — the emit scripts run under `--experimental-strip-types`
          # (TS without a build step), which Node 20 does NOT support (exit 9).
          node-version: 22

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # CI-only kernel install — NEVER written to package.json (zero-dep stays).
      - name: Install kernel validators (CI-only, --no-save)
        run: npm i --no-save @intentsolutions/core@0.2.0

      - name: Emit-evidence self-check (kernel-valid + canonical-stable)
        run: node --experimental-strip-types ci/emit-evidence.ts --self-check

      - name: Emit gate-result/v1 EvidenceBundle(s)
        run: node --experimental-strip-types ci/emit-evidence.ts --out build/evidence --ref "${GITHUB_REF}"

      - name: Sign each EvidenceBundle (cosign keyless → Rekor)
        run: |
          set -euo pipefail
          shopt -s nullglob
          signed=0
          for bundle in build/evidence/bundle-*.json; do
            case "$bundle" in *.sigstore.json) continue;; esac
            sig="${bundle%.json}.sigstore.json"
            echo "::group::cosign sign-blob $bundle"
            cosign sign-blob --yes --new-bundle-format --bundle "$sig" "$bundle"
            echo "::endgroup::"
            signed=$((signed + 1))
          done
          if [ "$signed" -eq 0 ]; then
            echo "::error::no EvidenceBundles were produced to sign"
            exit 1
          fi
          echo "✓ signed $signed bundle(s)"

      # ── Verify each signature back, in-repo, before publishing (iah-E10) ──
      #
      # Closes the dogfood chain end-to-end inside audit-harness's OWN pipeline:
      #   emit (ci/emit-evidence.ts, harness-hash self-gate)
      #     → sign (cosign sign-blob, Fulcio OIDC + Rekor, above)
      #     → VERIFY (this step) — cosign verify-blob each signed bundle against
      #       the exact GitHub Actions OIDC identity that produced it.
      #
      # Before this step existed, release.yml signed the bundles but nothing in
      # this repo's own CI ever verified them — the only verifier was the
      # downstream dashboard. That left the harness's own "verify chain
      # end-to-end" dogfood scope (iah-E10c) unclosed: a sign that no one in the
      # producing pipeline checks is not a verified chain. This step makes the
      # release fail-closed on an unverifiable signature.
      #
      # The verified identity is pinned to this workflow's own reusable-workflow
      # ref (repo + .github/workflows/release.yml@<ref>) and the GitHub Actions
      # OIDC issuer — the same subject ci/emit-evidence.ts records in the
      # manifest skeleton (signingClaims()) and the dashboard re-checks at
      # ingest. A signature whose certificate identity does not match those
      # claims fails the build.
      - name: Verify each EvidenceBundle signature (cosign verify-blob; fail-closed)
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Pin the verified certificate identity to THIS workflow ref + the GH
          # Actions OIDC issuer. github.ref is the pushed tag here (this job is
          # tag-only), so the identity is repo/.github/workflows/release.yml@<tag>.
          cert_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          cert_issuer="https://token.actions.githubusercontent.com"
          echo "verifying against identity: ${cert_identity}"
          verified=0
          for bundle in build/evidence/bundle-*.json; do
            case "$bundle" in *.sigstore.json) continue;; esac
            sig="${bundle%.json}.sigstore.json"
            if [ ! -s "$sig" ]; then
              echo "::error::expected signature ${sig} for ${bundle} but it is missing/empty"
              exit 1
            fi
            echo "::group::cosign verify-blob $bundle"
            cosign verify-blob \
              --new-bundle-format \
              --bundle "$sig" \
              --certificate-identity "$cert_identity" \
              --certificate-oidc-issuer "$cert_issuer" \
              "$bundle"
            echo "::endgroup::"
            verified=$((verified + 1))
          done
          if [ "$verified" -eq 0 ]; then
            echo "::error::no signed EvidenceBundles were found to verify"
            exit 1
          fi
          echo "✓ verified $verified signed bundle(s) — emit→sign→verify chain closed in-repo"

      - name: Assemble report-manifest.json (fail-closed on shape mismatch)
        run: node --experimental-strip-types ci/assemble-manifest.ts --dir build/evidence --out build/evidence/report-manifest.json

      - name: Publish report-manifest.json onto the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" build/evidence/report-manifest.json --clobber
          else
            gh release create "$tag" build/evidence/report-manifest.json \
              --title "audit-harness $tag" --generate-notes --latest
          fi
          echo "✓ report-manifest.json published to release $tag"

  # ── Publish the Python wrapper to PyPI (polyglot parity with npm) ──
  #
  # Tag-only (v*.*.*). GUARDED: the publish step no-ops when PYPI_TOKEN is not
  # configured as a repo secret — the job runs, detects the missing token, and
  # exits 0 with an explanatory log instead of failing the release. This lets the
  # job ship wired-but-dormant; it activates automatically the moment the secret
  # is set, with no further code change. NEVER publishes on a PR (PRs don't push
  # tags, and the `on:` trigger is tag/dispatch only).
  publish-pypi:
    name: Publish Python wrapper to PyPI (guarded on PYPI_TOKEN)
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # attach the .sigstore bundles onto the Release
      id-token: write # sigstore-python keyless signing (Fulcio OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # ISEDC E09 DR / CISO reproducible-from-tag invariant (#32 bug class):
          # the PyPI sdist/wheel is built from this checkout, so the bytes MUST
          # be the pushed tag's bytes. This job is tag-only.
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Guard: surface whether the publish token exists. secrets.* cannot be read
      # in a job-level `if`, so we gate the publish step on this step's output.
      - name: Check for PyPI token
        id: guard
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -n "${PYPI_TOKEN}" ]; then
            echo "token_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "token_present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PYPI_TOKEN secret is not set — skipping PyPI publish. Set it in repo secrets to activate this job automatically (see python/PUBLISH.md)."
          fi

      - name: Build sdist + wheel
        if: steps.guard.outputs.token_present == 'true'
        run: |
          python -m pip install --upgrade build twine
          cd python
          python -m build
          twine check dist/*

      # ── Keyless-sign the wheel + sdist with sigstore-python (bead kyk1) ──
      #
      # Per DR-010 Q2 hybrid language allowance, Python signing surfaces use
      # sigstore-python (the PyPI-ecosystem-native signer) rather than cosign —
      # mirroring how the npm leg uses npm --provenance and the emit-evidence job
      # uses cosign. Produces a `<artifact>.sigstore` Sigstore bundle (Fulcio OIDC
      # cert + Rekor inclusion proof) next to each dist artifact. The signing
      # identity is this workflow's reusable-workflow ref. Guarded on the same
      # PYPI_TOKEN gate as the publish: a signature only has meaning alongside the
      # bytes that actually ship, so we sign exactly when (and only when) we publish.
      - name: Sign wheel + sdist (sigstore-python keyless → Rekor)
        if: steps.guard.outputs.token_present == 'true'
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: ./python/dist/*.whl ./python/dist/*.tar.gz
          # We attach the bundles onto the GitHub Release ourselves below, so
          # don't let the action upload its own duplicate workflow artifacts.
          upload-signing-artifacts: false

      - name: Publish to PyPI
        if: steps.guard.outputs.token_present == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          cd python
          # Upload ONLY the built distributions — NOT the .sigstore.json bundles
          # the signing step drops into dist/ (twine rejects them as
          # "Unknown distribution format"). The Sigstore bundles are attached to
          # the GitHub Release in the next step. (fix: v1.2.1 PyPI publish failure)
          twine upload --non-interactive dist/*.whl dist/*.tar.gz
          echo "✓ published Python wrapper to PyPI"

      # Attach the Sigstore bundles onto this tag's Release so consumers can
      # `python -m sigstore verify identity ...` the downloaded wheel/sdist. The
      # `release` job above already created the Release on this tag.
      - name: Publish .sigstore bundles onto the Release
        if: steps.guard.outputs.token_present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="${GITHUB_REF#refs/tags/}"
          bundles=(python/dist/*.sigstore python/dist/*.sigstore.json)
          if [ "${#bundles[@]}" -eq 0 ]; then
            echo "::error::sigstore signing produced no bundles to attach"
            exit 1
          fi
          gh release upload "$tag" "${bundles[@]}" --clobber
          echo "✓ attached ${#bundles[@]} Sigstore bundle(s) to release $tag"

  # ── Publish the Rust wrapper to crates.io (polyglot parity with npm) ──
  #
  # Tag-only (v*.*.*). GUARDED: the publish step no-ops when CARGO_REGISTRY_TOKEN
  # is not configured as a repo secret — same wired-but-dormant pattern as the
  # PyPI job. NEVER publishes on a PR.
  publish-crates:
    name: Publish Rust wrapper to crates.io (guarded on CARGO_REGISTRY_TOKEN)
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # attest-build-provenance keyless signing (Fulcio OIDC)
      attestations: write # write the build-provenance attestation to the repo
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # ISEDC E09 DR / CISO reproducible-from-tag invariant (#32 bug class):
          # the crates.io crate is built + published from this checkout, so the
          # bytes MUST be the pushed tag's bytes. This job is tag-only.
          ref: ${{ github.ref }}

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # Guard: surface whether the publish token exists (see PyPI job note).
      - name: Check for crates.io token
        id: guard
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "token_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "token_present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CARGO_REGISTRY_TOKEN secret is not set — skipping crates.io publish. Set it in repo secrets to activate this job automatically (see rust/PUBLISH.md)."
          fi

      - name: Verify (cargo publish --dry-run)
        if: steps.guard.outputs.token_present == 'true'
        run: |
          cd rust
          cargo publish --dry-run

      # ── Build-provenance attestation for the crate tarball (bead 13ty) ──
      #
      # crates.io supports verifiable build provenance: `cargo package` produces
      # the exact `.crate` tarball that `cargo publish` uploads, and GitHub's
      # attest-build-provenance generates a SLSA in-toto provenance predicate for
      # that tarball, signed keyless via Sigstore (Fulcio cert + Rekor inclusion).
      # We `cargo package` first to materialize the tarball, attest those exact
      # bytes, then `cargo publish` ships the same bytes. Guarded on the same
      # CARGO_REGISTRY_TOKEN gate: provenance only has meaning for bytes that ship.
      - name: Package crate tarball (the exact bytes cargo publish uploads)
        if: steps.guard.outputs.token_present == 'true'
        run: |
          cd rust
          cargo package --locked || cargo package
          echo "CRATE_TARBALL=$(ls "$PWD"/target/package/*.crate)" >> "$GITHUB_ENV"

      - name: Attest crate build provenance (SLSA → Sigstore/Rekor)
        if: steps.guard.outputs.token_present == 'true'
        uses: actions/attest-build-provenance@v4.1.1
        with:
          subject-path: ${{ env.CRATE_TARBALL }}

      - name: Publish to crates.io
        if: steps.guard.outputs.token_present == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cd rust
          cargo publish
          echo "✓ published Rust wrapper to crates.io (build-provenance attested)"

  # ── Alert on a failed tag-release over the tailnet (bead 59tx) ──
  #
  # Fires ONLY when one of the release jobs above fails (`if: failure()`),
  # joining the tailnet via Tailscale OIDC and pushing a high-priority ntfy
  # alert to the tailnet-only `prod-deploys` topic. TAG-TRIGGERED ONLY — the
  # parent workflow runs on `push: tags v*.*.*` / `workflow_dispatch`, so this
  # job NEVER runs on a PR; it only fires on a future failed tag-release.
  alert-on-failure:
    name: alert-on-failure
    needs: [release, emit-evidence, publish-pypi, publish-crates]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # Tailscale OIDC

    steps:
      - name: Join tailnet (Tailscale OIDC)
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OIDC_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Wait for tailnet
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if sudo tailscale ping --c 1 --timeout 2s 100.88.144.55; then
              echo "tailnet reachable after attempt $i"
              exit 0
            fi
            echo "tailnet not reachable yet (attempt $i); retrying..."
            sleep 2
          done
          echo "::error::tailnet host 100.88.144.55 unreachable after 20 attempts"
          exit 1

      - name: Notify ntfy
        env:
          NTFY_AUTH_TOKEN: ${{ secrets.NTFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -m 10 -X POST "http://intentsolutions:8080/prod-deploys" \
            -H "Title: [audit-harness] Release CI FAILED" \
            -H "Priority: high" \
            -H "Tags: prod-deploys,rotating_light" \
            -H "Authorization: Bearer ${NTFY_AUTH_TOKEN}" \
            --data "Release CI failed on ${{ github.ref_name }} (sha ${{ github.sha }}). Run: ${run_url}"

  # ── Notify the platform umbrella to regenerate its aggregate changelog ──
  #
  # The umbrella repo intent-solutions-io/intent-eval-platform keeps an aggregate
  # CHANGELOG.md regenerated from every platform repo's GitHub Releases. It already
  # regenerates daily + on workflow_dispatch + on a repository_dispatch of type
  # "release-published". This job pings the umbrella once this repo's GH Release is
  # published, so the aggregate updates instantly instead of waiting up to a day.
  #
  # WHY this lives INSIDE release.yml (not a standalone `on: release: published`
  # workflow): GitHub suppresses workflow events triggered by releases that a
  # GITHUB_TOKEN created — and the `release` job above creates the Release with
  # GITHUB_TOKEN — so a standalone release-triggered workflow would never fire.
  # Running here, after the GH Release exists (needs: [emit-evidence], which itself
  # needs release), is the only reliable way to notify on a GITHUB_TOKEN release.
  #
  # Best-effort (continue-on-error: true) — the umbrella's daily schedule is the
  # backstop. GUARDED: cleanly no-ops + exits 0 when UMBRELLA_DISPATCH_TOKEN is not
  # configured, so this is safe to merge before the secret is provisioned.
  notify-umbrella-changelog:
    name: Notify umbrella to regenerate the platform changelog
    needs: [emit-evidence]
    runs-on: ubuntu-latest
    continue-on-error: true # best-effort; the umbrella's daily schedule is the backstop
    permissions:
      contents: read
    steps:
      - name: Dispatch release-published to the platform umbrella
        env:
          DISPATCH_TOKEN: ${{ secrets.UMBRELLA_DISPATCH_TOKEN }}
        run: |
          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "UMBRELLA_DISPATCH_TOKEN not configured — skipping umbrella notify (its daily schedule still picks up this release)."
            exit 0
          fi
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/intent-solutions-io/intent-eval-platform/dispatches \
            -d "{\"event_type\":\"release-published\",\"client_payload\":{\"repo\":\"${GITHUB_REPOSITORY}\",\"ref\":\"${GITHUB_REF_NAME}\"}}"
          echo "Dispatched release-published to intent-solutions-io/intent-eval-platform."
