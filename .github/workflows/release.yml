name: Release

# Publishes @intentsolutions/audit-harness to npm with Sigstore provenance.
#
# This is the package's first real release pipeline. Before it existed, npm was
# stuck at 0.1.0 while the code had advanced to 1.1.x — there was no workflow to
# publish the CHANGELOG-documented work. This closes that gap.
#
# Triggered by:
#   - pushing a tag matching `v*.*.*` (e.g., v1.1.5), OR
#   - manual `workflow_dispatch` (publishes whatever version package.json carries)
#
# The job:
#   1. Verifies package.json#version matches the pushed tag (skipped on manual
#      dispatch, where there is no tag to compare against).
#   2. Runs the self-check (`audit-harness --version`) and the repo's `test`
#      script (escape-scan on the staged diff — non-blocking when nothing is
#      staged, which is the case in CI).
#   3. `npm publish --provenance --access public` (requires id-token: write for
#      the Sigstore OIDC token).
#
# This is a zero-runtime-dependency polyglot CLI: Node >=18 dispatcher + bash/
# python scripts. There is NO lockfile, NO TypeScript build, NO coverage step —
# so this workflow deliberately omits pnpm, --frozen-lockfile, build, and
# coverage steps that the intent-eval-core release workflow carries.
#
# Provenance attestation lands at https://registry.npmjs.org/@intentsolutions/audit-harness
# alongside the published tarball. Consumers can verify with `npm audit signatures`.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance (Sigstore OIDC token).
  id-token: write

jobs:
  release:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Verify tag matches package.json version
        # Only meaningful on a tag push. On workflow_dispatch there is no tag,
        # so skip the comparison and publish whatever version package.json holds.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF#refs/tags/v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag v$tag_version does not match package.json version $pkg_version"
            exit 1
          fi
          echo "Tag and package version both: $tag_version"

      - name: Self-check (audit-harness --version)
        run: node bin/audit-harness.js --version

      - name: Test (escape-scan on staged diff; non-blocking in CI)
        run: bash scripts/escape-scan.sh --staged || true

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
