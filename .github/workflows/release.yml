name: Release

# Publishes @intentsolutions/audit-harness to npm with Sigstore provenance.
#
# This is the package's first real release pipeline. Before it existed, npm was
# stuck at 0.1.0 while the code had advanced to 1.1.x — there was no workflow to
# publish the CHANGELOG-documented work. This closes that gap.
#
# Triggered by:
#   - pushing a tag matching `v*.*.*` (e.g., v1.1.5), OR
#   - manual `workflow_dispatch` (publishes whatever version package.json carries)
#
# The job:
#   1. Verifies package.json#version matches the pushed tag (skipped on manual
#      dispatch, where there is no tag to compare against).
#   2. Runs the self-check (`audit-harness --version`) and the repo's `test`
#      script (escape-scan on the staged diff — non-blocking when nothing is
#      staged, which is the case in CI).
#   3. `npm publish --provenance --access public` (requires id-token: write for
#      the Sigstore OIDC token).
#
# This is a zero-runtime-dependency polyglot CLI: Node >=18 dispatcher + bash/
# python scripts. There is NO lockfile, NO TypeScript build, NO coverage step —
# so this workflow deliberately omits pnpm, --frozen-lockfile, build, and
# coverage steps that the intent-eval-core release workflow carries.
#
# Provenance attestation lands at https://registry.npmjs.org/@intentsolutions/audit-harness
# alongside the published tarball. Consumers can verify with `npm audit signatures`.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write  # create the GitHub Release + upload the dashboard manifest asset
  # Required for npm provenance + cosign keyless (Sigstore OIDC token).
  id-token: write

jobs:
  release:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Verify tag matches package.json version
        # Only meaningful on a tag push. On workflow_dispatch there is no tag,
        # so skip the comparison and publish whatever version package.json holds.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF#refs/tags/v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag v$tag_version does not match package.json version $pkg_version"
            exit 1
          fi
          echo "Tag and package version both: $tag_version"

      - name: Self-check (audit-harness --version)
        run: node bin/audit-harness.js --version

      - name: Test (escape-scan on staged diff; non-blocking in CI)
        run: bash scripts/escape-scan.sh --staged || true

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Create the GitHub Release on a tag push so the emit-evidence job below can
      # attach the dashboard's report-manifest.json to it. (Only meaningful on a
      # tag; workflow_dispatch has no tag to release.)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
          else
            gh release create "$tag" --title "audit-harness $tag" --generate-notes --latest
          fi

  # ── Emit this repo's own testing evidence for the dashboard (bead nr75.12) ──
  #
  # CI-ONLY. @intentsolutions/core is installed with `npm i --no-save` so the
  # published zero-dependency package surface stays untouched (package.json keeps
  # empty dependencies + devDependencies). The emitter lives in ci/ (excluded
  # from package.json#files), so it never ships to npm consumers.
  #
  # Runs audit-harness's real deterministic self-gate (harness-hash --verify) →
  # kernel gate-result/v1 row → kernel EvidenceBundle (ci/emit-evidence.ts,
  # fail-closed against the @intentsolutions/core schemas pinned to the version
  # the dashboard verifies with), keyless-signs the canonical bytes with cosign
  # (Fulcio OIDC + Rekor), assembles report-manifest.json, and uploads it onto
  # this tag's Release. The dashboard re-verifies OIDC subject + Rekor inclusion +
  # DSSE + kernel schema at ingest. Only runs on a tag push (the dashboard pins
  # refs/tags/* — a workflow_dispatch main-ref manifest would not verify).
  emit-evidence:
    name: Emit signed gate-result evidence for the dashboard
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload the manifest onto the Release
      id-token: write # cosign keyless (Fulcio OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Node >= 22.6 — the emit scripts run under `--experimental-strip-types`
          # (TS without a build step), which Node 20 does NOT support (exit 9).
          node-version: 22

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # CI-only kernel install — NEVER written to package.json (zero-dep stays).
      - name: Install kernel validators (CI-only, --no-save)
        run: npm i --no-save @intentsolutions/core@0.2.0

      - name: Emit-evidence self-check (kernel-valid + canonical-stable)
        run: node --experimental-strip-types ci/emit-evidence.ts --self-check

      - name: Emit gate-result/v1 EvidenceBundle(s)
        run: node --experimental-strip-types ci/emit-evidence.ts --out build/evidence --ref "${GITHUB_REF}"

      - name: Sign each EvidenceBundle (cosign keyless → Rekor)
        run: |
          set -euo pipefail
          shopt -s nullglob
          signed=0
          for bundle in build/evidence/bundle-*.json; do
            case "$bundle" in *.sigstore.json) continue;; esac
            sig="${bundle%.json}.sigstore.json"
            echo "::group::cosign sign-blob $bundle"
            cosign sign-blob --yes --new-bundle-format --bundle "$sig" "$bundle"
            echo "::endgroup::"
            signed=$((signed + 1))
          done
          if [ "$signed" -eq 0 ]; then
            echo "::error::no EvidenceBundles were produced to sign"
            exit 1
          fi
          echo "✓ signed $signed bundle(s)"

      - name: Assemble report-manifest.json (fail-closed on shape mismatch)
        run: node --experimental-strip-types ci/assemble-manifest.ts --dir build/evidence --out build/evidence/report-manifest.json

      - name: Publish report-manifest.json onto the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" build/evidence/report-manifest.json --clobber
          else
            gh release create "$tag" build/evidence/report-manifest.json \
              --title "audit-harness $tag" --generate-notes --latest
          fi
          echo "✓ report-manifest.json published to release $tag"

  # ── Publish the Python wrapper to PyPI (polyglot parity with npm) ──
  #
  # Tag-only (v*.*.*). GUARDED: the publish step no-ops when PYPI_TOKEN is not
  # configured as a repo secret — the job runs, detects the missing token, and
  # exits 0 with an explanatory log instead of failing the release. This lets the
  # job ship wired-but-dormant; it activates automatically the moment the secret
  # is set, with no further code change. NEVER publishes on a PR (PRs don't push
  # tags, and the `on:` trigger is tag/dispatch only).
  publish-pypi:
    name: Publish Python wrapper to PyPI (guarded on PYPI_TOKEN)
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Guard: surface whether the publish token exists. secrets.* cannot be read
      # in a job-level `if`, so we gate the publish step on this step's output.
      - name: Check for PyPI token
        id: guard
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -n "${PYPI_TOKEN}" ]; then
            echo "token_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "token_present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PYPI_TOKEN secret is not set — skipping PyPI publish. Set it in repo secrets to activate this job automatically (see python/PUBLISH.md)."
          fi

      - name: Build sdist + wheel
        if: steps.guard.outputs.token_present == 'true'
        run: |
          python -m pip install --upgrade build twine
          cd python
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        if: steps.guard.outputs.token_present == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          cd python
          twine upload --non-interactive dist/*
          echo "✓ published Python wrapper to PyPI"

  # ── Publish the Rust wrapper to crates.io (polyglot parity with npm) ──
  #
  # Tag-only (v*.*.*). GUARDED: the publish step no-ops when CARGO_REGISTRY_TOKEN
  # is not configured as a repo secret — same wired-but-dormant pattern as the
  # PyPI job. NEVER publishes on a PR.
  publish-crates:
    name: Publish Rust wrapper to crates.io (guarded on CARGO_REGISTRY_TOKEN)
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # Guard: surface whether the publish token exists (see PyPI job note).
      - name: Check for crates.io token
        id: guard
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "token_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "token_present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CARGO_REGISTRY_TOKEN secret is not set — skipping crates.io publish. Set it in repo secrets to activate this job automatically (see rust/PUBLISH.md)."
          fi

      - name: Verify (cargo publish --dry-run)
        if: steps.guard.outputs.token_present == 'true'
        run: |
          cd rust
          cargo publish --dry-run

      - name: Publish to crates.io
        if: steps.guard.outputs.token_present == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cd rust
          cargo publish
          echo "✓ published Rust wrapper to crates.io"

  # ── Alert on a failed tag-release over the tailnet (bead 59tx) ──
  #
  # Fires ONLY when one of the release jobs above fails (`if: failure()`),
  # joining the tailnet via Tailscale OIDC and pushing a high-priority ntfy
  # alert to the tailnet-only `prod-deploys` topic. TAG-TRIGGERED ONLY — the
  # parent workflow runs on `push: tags v*.*.*` / `workflow_dispatch`, so this
  # job NEVER runs on a PR; it only fires on a future failed tag-release.
  alert-on-failure:
    name: alert-on-failure
    needs: [release, emit-evidence, publish-pypi, publish-crates]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # Tailscale OIDC

    steps:
      - name: Join tailnet (Tailscale OIDC)
        uses: tailscale/github-action@v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_OIDC_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Wait for tailnet
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if sudo tailscale ping --c 1 --timeout 2s 100.88.144.55; then
              echo "tailnet reachable after attempt $i"
              exit 0
            fi
            echo "tailnet not reachable yet (attempt $i); retrying..."
            sleep 2
          done
          echo "::error::tailnet host 100.88.144.55 unreachable after 20 attempts"
          exit 1

      - name: Notify ntfy
        env:
          NTFY_AUTH_TOKEN: ${{ secrets.NTFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -m 10 -X POST "http://intentsolutions:8080/prod-deploys" \
            -H "Title: [audit-harness] Release CI FAILED" \
            -H "Priority: high" \
            -H "Tags: prod-deploys,rotating_light" \
            -H "Authorization: Bearer ${NTFY_AUTH_TOKEN}" \
            --data "Release CI failed on ${{ github.ref_name }} (sha ${{ github.sha }}). Run: ${run_url}"
