# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit — audit-harness (Intent Eval Platform). Semantic AI code review.
# Three non-overlapping layers: L1 deterministic CI (markdownlint/yamllint/
# actionlint/typos/shellcheck/ruff/eslint/lychee) owns style + scripts hygiene;
# CodeRabbit (here) owns semantic review; CodeQL (security-extended) owns
# security. CodeRabbit's built-in linters are disabled so it never re-reports
# what L1 already gates. Terse, assertive, findings-only. gitleaks (CodeRabbit-
# native secret scan) stays ON.
language: en-US
tone_instructions: "Be terse and technical. No preamble, praise, poems, or summaries — findings only: the problem, the file and line, the concrete fix. Flag every real issue; never soft-pedal or skip. Hardcore code review, not a status report."
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: false
  changed_files_summary: false
  sequence_diagrams: false
  poem: false
  review_status: false
  in_progress_fortune: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  tools:
    eslint:
      enabled: false
    ruff:
      enabled: false
    markdownlint:
      enabled: false
    yamllint:
      enabled: false
    actionlint:
      enabled: false
    shellcheck:
      enabled: false
  path_filters:
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!**/coverage/**"
    - "!**/*.snap"
    - "!**/*.lock"
    - "!pnpm-lock.yaml"
  path_instructions:
    - path: "**/*.{sh,bash,py,js,mjs,cjs,ts}"
      instructions: >-
        audit-harness ships deterministic gate scripts (escape-scan, crap-score, arch-check,
        harness-hash, bias-count, gherkin-lint) + emit-evidence. A silently-broken gate is
        worse than no gate. Flag, by priority: (1) a detection script that silently no-ops —
        a regex with a leading slash that never matches root-relative `git diff --name-only`
        paths; a gate whose exit code is always 0 (`|| true`, swallowed `$?`, a missing
        `exit`); a loop that `continue`s past the only failing case. (2) unsafe bash under
        `set -u`: array expansion must be `${ARR[@]+"${ARR[@]}"}` not `"${ARR[@]:-}"`;
        unquoted `$var` in `[ ]`/`test`; word-splitting on command substitution. (3)
        non-determinism that makes a gate's output unreproducible across runs/platforms
        (unsorted `find`/`glob`, locale-dependent `sort`, timestamp/PID in hashed output).
        (4) emit-evidence writing an Evidence-Bundle shape that diverges from the kernel
        @intentsolutions/core contract. (5) a polyglot manifest (npm/PyPI/crate) whose
        version or license drifts from the others.
    - path: "**/*.{yml,yaml}"
      instructions: >-
        Flag CI lanes that can never fire or that pin an action to a moving @master/@latest;
        a gate added as advisory that should block.
chat:
  auto_reply: true
